name: full-suite

# Non-blocking companion to ci.yml. The required gate stays the
# release-gate job in ci.yml (release-critical markers only). This
# workflow runs the whole pytest tree plus the research-case replays so
# slow and historical tests are exercised somewhere. It is not a required
# status check; trigger it by hand or let the weekly schedule run it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: full-suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,observations]"
      - name: Full test suite (tests/)
        run: python -m pytest -q -ra --durations=25
      - name: Research-case replays
        if: ${{ !cancelled() }}
        run: python -m pytest -q -ra research-cases
