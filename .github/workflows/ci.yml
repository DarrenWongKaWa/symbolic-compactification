name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
      - name: Clean-room firewall
        run: python scripts/check_clean_room.py
      - name: Package and CLI smoke
        run: |
          python -m pip check
          python -c "import symbolic_compactification"
          symbolic-compactification --version
          symbolic-compactification --help
