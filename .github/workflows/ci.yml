name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Core semantic tests
        run: python -m pytest -q -m "release_critical or derivation_audit_release_critical"
      - name: Clean-room firewall
        run: python scripts/check_clean_room.py
      - name: Package and CLI smoke
        run: |
          python -m pip check
          python -c "import symbolic_compactification"
          symbolic-compactification --version
          symbolic-compactification --help
      - name: Forward demos
        run: make forward-demo PYTHON=python
      - name: Minimal audit demo
        run: |
          cp -R examples/audit/minimal /tmp/ssc-audit-ci
          symbolic-compactification audit verify /tmp/ssc-audit-ci
          symbolic-compactification audit table /tmp/ssc-audit-ci
      - name: Guo flagship inventory replay
        run: python examples/flagship/guo/scripts/inventory_equations.py
