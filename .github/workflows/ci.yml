name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Merge gate matches the product release contract, not the frozen historical
# suite. Required: release_critical, derivation_audit_release_critical,
# clean-room, package/CLI smoke. `pytest tests/` is informational only.

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Research-preview release-critical
        run: python -m pytest -q -m release_critical
      - name: Derivation-audit release-critical
        run: python -m pytest -q -m derivation_audit_release_critical
      - name: Clean-room firewall
        run: python scripts/check_clean_room.py
      - name: Package and CLI smoke
        run: |
          python -m pip check
          python -c "import symbolic_compactification"
          symbolic-compactification --version
          symbolic-compactification --help

  historical-full-suite:
    name: historical-full-suite
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Historical full suite (informational)
        run: |
          set +e
          python -m pytest tests/ -q
          status=$?
          {
            echo "### Historical full suite (Python ${{ matrix.python-version }})"
            echo
            echo "Exit code: \`$status\`"
            echo
            echo "This job is informational. Merge is gated on \`release-gate\` only."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Historical full suite::exited $status (not a merge gate)"
          fi
          exit 0
