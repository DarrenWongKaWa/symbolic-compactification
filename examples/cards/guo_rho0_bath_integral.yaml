# Guo et al. (arXiv:2511.16422) Eq. rho_0_supp: Lorentzian-broadened occupation.
expect: CERTIFIED_BY_RULE
check: fermi_integral
symbols:
  - {name: beta, positive: true}
  - {name: G, positive: true}
  - {name: e}
  - {name: mu}
  - {name: wb}
define:
  zp(x): 1/2 + beta*(G + I*(x - mu))/(2*pi)
  zm(x): 1/2 + beta*(G - I*(x - mu))/(2*pi)
  fp(x): 1/2 + I/pi*polygamma(0, zp(x))
  fm(x): 1/2 - I/pi*polygamma(0, zm(x))
  rho0(x): (fp(x) + fm(x))/2
variable: wb
beta: beta
# int dw_b/(2 pi) 2G/(w_b^2+G^2) f0(e + w_b), with f0(x) = nF(x - mu)
integrand: G/(pi*(wb**2 + G**2))*nF(e - mu + wb)
claim: rho0(e)
