[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-compactification"
version = "0.3.0"
description = "Agent-native symbolic compactification and exact certification engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
symbolic-compactification = "symbolic_compactification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
