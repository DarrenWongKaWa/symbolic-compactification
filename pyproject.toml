[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-compactification"
version = "0.2.0"
description = "Standalone symbolic compactification engine: strict SymPy parser, exact verifier kernel, and residual bookkeeping."
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
symbolic-compactification = "symbolic_compactification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
