[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-compactification"
version = "0.3.2-alpha"
description = "Agent-assisted scientific derivation-audit with reviewer HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6,<7",
    "sympy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
observations = [
    "matchpy>=0.5.5,<0.6",
]
egraph = [
    "egglog>=0.12",
]

[project.scripts]
symbolic-compactification = "symbolic_compactification.cli:main"
ssc = "symbolic_compactification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "release_critical: fast fail-closed research-preview release gate",
    "derivation_audit_release_critical: v0.2 derivation-audit release gate",
]
